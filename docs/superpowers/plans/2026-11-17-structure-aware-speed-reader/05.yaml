tasks:
- number: 1
  title: Speech driver (spec section 9)
  steps:
  - id: P5.T1.S1
    text: |-
      RED: `packages/core/src/tts.test.ts` with a fake `speechSynthesis` and fake clock: no API -> `available: false`; voices are read at start and again on `voiceschanged`, and `noLocalVoice` is concluded only after that event or 2 s; default voice = first local voice matching the language, else first local, never a network voice; `speak(sentence, chunks, wpm)` creates one utterance with rate wpm/180 clamped 0.5-3 whose text omits math atoms; each `boundary` charIndex selects the chunk containing it (math atom characters skipped in the mapping) and calls `onChunk`; `end` calls `onEnd`; no boundary within 1 s -> `onWholeSentence` and after two such sentences in a row the voice is treated as boundary-less for the session; `cancel()` cancels the utterance and suppresses its callbacks.
  - id: P5.T1.S2
    text: |-
      GREEN: implement `tts.ts`.
  - id: P5.T1.S3
    text: |-
      REFACTOR: remove duplication and unclear names introduced by this task, keep the public types as the spec defines them, re-run `npm test` (Vitest, all workspaces) green. If nothing needs changing, record why in the step record's `refactor:` field for this task.
- number: 2
  title: Player and UI integration, voice panel
  steps:
  - id: P5.T2.S1
    text: |-
      RED: extend `player.test.ts` and add `ui/tts-panel.test.ts`: with tts enabled prose sentences and list items are driven by the driver (chunk display from `onChunk`, next sentence on `onEnd`, whole sentence shown on `onWholeSentence`), titles are spoken, stops, dwells, pause, jumps and close cancel speech, continue starts the next utterance, code, tables and math are never spoken. Panel: the toggle is off by default; with no API it is disabled with a note; voices are listed with a `local` or `network` label; with no local voice the text "No offline voice installed" is shown and the toggle cannot be turned on until a voice is picked; picking a network voice shows "This voice needs a network connection"; the line "Offline speech uses voices installed on this device" is always present; the choice is saved.
  - id: P5.T2.S2
    text: |-
      GREEN: implement the integration in `player.ts`, `ui/stage.ts` and `ui/settings-panel.ts` (replacing the phase 2 placeholder row); add the `speedRead.tts.*` configuration properties in the VS Code package.json and keep its manifest test green.
  - id: P5.T2.S3
    text: |-
      Browser-level: in `tests/e2e/core.spec.ts` inject a fake `speechSynthesis` with one local and one network voice into the demo and assert the labels, the warning, and that chunks follow injected boundary events. Extend `scripts/capture-visual.mjs` to write `.visual/phase-5/` for `speech settings with local and network voices`; run it, open the screenshot, fill the step record's `visual:` section.
- number: 3
  title: 'README: install, use, limits (R23)'
  steps:
  - id: P5.T3.S1
    text: |-
      RED: `tests/readme.test.ts` asserts README.md has the headings Install (with Chrome, Firefox and VS Code subsections), Usage, Keys, Settings, Offline and text-to-speech, Known limits, Development, License, and that every key of R11 and every setting of R12 is named.
  - id: P5.T3.S2
    text: |-
      GREEN: write README.md: what it is; install for Chrome (build or download the zip, `chrome://extensions`, Developer mode, Load unpacked `packages/browser-extension/dist/chrome`), Firefox 128+ (`about:debugging`, Load Temporary Add-on, pick `dist/firefox/manifest.json`; removed on restart; a permanent install needs a Mozilla-signed build or Developer Edition/Nightly with `xpinstall.signatures.required` off; granting access to all sites for Alt-hover), VS Code (`code --install-extension dist/speed-read-vscode.vsix`, or Extensions: Install from VSIX); usage per host including every entry point; keys table; settings table with defaults; offline notes and the TTS voice rules; known limits exactly as the spec lists them (Linux Alt+click, selectors by ancestor id, inline math shown as source, unrendered Mermaid on web pages, chat panels in VS Code, block-granular cursor follow, physical entry points and chat sites verified by hand); development commands; MIT.
  - id: P5.T3.S3
    text: |-
      No refactor step: prose only; record `refactor: {P5.T3: "documentation, nothing to restructure"}`.
- number: 4
  title: Packaging and CI artifacts (R25), final gate
  steps:
  - id: P5.T4.S1
    text: |-
      RED: `tests/package.test.ts` (runs after `npm run package`, skipped with a clear message when dist is absent): the three files `dist/speed-read-chrome.zip`, `dist/speed-read-firefox.zip`, `dist/speed-read-vscode.vsix` exist and each archive lists its manifest (`manifest.json` / `extension/package.json`). Also assert `.github/workflows/ci.yml` triggers on `pull_request` and on `push` to `main` and has an upload step covering the three paths.
  - id: P5.T4.S2
    text: |-
      GREEN: make root `npm run package` build everything and produce all three; set the workflow's upload step to `if-no-files-found: error`; add `npm run package` before the package test in the workflow.
  - id: P5.T4.S3
    text: |-
      REFACTOR + quality gate: `npm run typecheck`, `npm test` (Vitest, all workspaces), `npm run test:e2e` (Playwright, Chromium), `npm run package`; then run the full suite after the last code commit into a log outside the repository.
