  number: 2
  title: Structure extraction and the reader UI, with a demo page and browser-level
    tests (R3, R10-R12)
  tag: agentic
  depends_on:
  - 1
  tracking_issue: null
  acceptance:
  - structure-extraction
  - reader-three-zone-ui
  - reader-keys
  - reader-settings
