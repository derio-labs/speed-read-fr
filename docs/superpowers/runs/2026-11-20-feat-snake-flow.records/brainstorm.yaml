    op: reword
    why: "The shipped display misread the intent; the snake ribbon replaces it (spec 2026-11-20-snake-flow R1-R7, R10, R12)."
    acceptance: "In flow mode the reader shows three rows of one continuous text ribbon in a near-full-width window; words glide one at a time into a fixed braced target at the middle row's centre with their middle letter red, the ribbon wrapping upward bottom to middle to top, and the wheel moves it backward or forward word by word; cards and stops behave as in chunk mode."
