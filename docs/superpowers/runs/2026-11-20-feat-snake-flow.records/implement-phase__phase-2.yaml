journal:
  - {kind: decision, id: p2-stored-vs-effective, phase: 2, title: "Settings stay as the user set them; the reader runs on an effective copy", body: "mount.ts keeps `settings` (stored, saved, shown in the panel) and builds the timeline and player from `effective(settings)`, whose chunkChars is clamped to the measured fit. The player's speed-only settings event now merges just wpm back, so a speed change never saves the clamped characters value."}
  - {kind: decision, id: p2-fit-from-display, phase: 2, title: "Fit is measured from the .sr-display width and a hidden .sr-fit-probe", body: "chunkFit(displayWidth, probeWidth) = floor(display / (probe/10)) in [5,80], null at width 0. The probe has its own class (not sr-chunk) so queries for .sr-chunk never hit it; both read the --sr-chunk-font variable. Measured at mount and from a ResizeObserver on the stage; a changed effective limit rebuilds the timeline in chunk mode only (flow steps one word at a time)."}
  - {kind: decision, id: p2-atom-pacing-every-mode, phase: 2, title: "Atom pacing (base x max(1, ceil(len/8)), no long-token bonus) applies to every chunk step, not only flow", body: "The spec words it per atom token, so stepDuration times each atom token that way wherever it sits; words keep base plus 0.3 base above 8 characters. In flow every step is one token, so it is exactly the spec's rule."}
  - {kind: discovery, id: p2-dock-test-followed-cap, phase: 2, title: "extension.spec 'dock keeps the chunk stage fixed' encoded the old 3/20 cap", body: "It saved chunkWords 10 / chunkChars 80 and relied on the cap; it now saves 3/20, and the wide-identifier step accepts that a chunk wider than the stage shrinks (its atoms scale with the chunk) instead of keeping the stage's 24px."}
  - {kind: decision, id: p2-inline-fixture, phase: 2, title: "Demo reads tests/fixtures/inline-code.html with ?doc=inline", body: "The shared article fixture is used by the extension suites, so it was left alone; the demo gained a ?doc=inline switch for a document with a long inline code atom, a 6-word clause and a very wide token."}
  - {kind: discovery, id: p2-chunk-stage-420-fit, phase: 2, title: "A 40-character chunk cannot show in the 420px chunk stage: fit is about 29", body: "Chunk mode keeps its 420px stage (spec out of scope), so at 24px the fit is ~29 characters and a stored 40 is clamped to it (stored value kept). The e2e shows the 6-word clause 'To be or not to be,' whole in panel layout, asserts the effective limit equals min(stored, fit), the panel's maximum shows fit and words max 10, and the over-wide token wraps with no ellipsis."}
  - {kind: discovery, id: p2-bottom-stage-grid-text-width, phase: 2, title: "The bottom-stage chunk is a stretched grid, so align() measures text with a Range", body: "Its .sr-chunk is position:absolute inset:0 with 1fr/auto/1fr columns, so a part's box width is not its text width. In bottom-stage hosts align() sums Range widths of before, pivot and after (an empty part is 0) and uses the axis at 50%; elsewhere it measures boxes as before."}
  - {kind: finding, id: p2-panel-support-under-outline, phase: 2, state: open, review_scope: out, title: "Panel layout: the open contents sidebar also covers the left of the stop prompt and exhibit cards", body: "Same cause as p1-panel-outline-overlap: .sr-outline is absolutely placed over the left ~290px of the full-width panel, and the stage-support area (details card and exhibits list) spans the whole width. Block stops show it today as well; the inline stop prompt and exhibit card (panel-inline-code-stop.png) are half hidden until the sidebar is closed. Left alone: the stage inset fix does not extend to the support area and the spec has no requirement for it."}
