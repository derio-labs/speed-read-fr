- kind: review
  id: spec-review-1
  title: 'independent spec review: 10 findings'
  body: 'fr-spec-reviewer checked the spec against brief 900e6fa5f411 and decisions d1-d6, the codebase (file:line for every named file) and internal consistency. Ten findings, all in scope: exhibit model
    (s-r1), bottom-stage overlay layout (s-r2), cap and wrap in bottom-stage hosts (s-r3, s-r4), estimated speech boundaries (s-r5), glide duration (s-r6), mid-sentence chip stops (s-r7), middle-letter
    and atom pacing rules (s-r8), Test Plan coverage (s-r9), row verify key (s-r10).'
- kind: lens
  lens: tests
  title: Checks must run on the bottom-stage layouts users see, not only the plain demo
- kind: lens
  lens: simplicity
  title: Ribbon layout over a bounded word window vs rendering only words near the target
resolves:
- id: s-r1
  state: fixed
  body: Design now names a TimelineExhibit union with an inline variant, a per-exhibit identity key (b<block>i<inline>), core rendering via <pre><code> (never host.exhibit), and a unit test for two long
    atoms in one block.
- id: s-r2
  state: fixed
  body: Width section now targets the bottom-stage rules (styles.ts:470-472, 515-517); demo gains a ?bottomStage switch and Playwright runs flow/width checks on it.
- id: s-r3
  state: fixed
  body: 'R11 now covers every bottom-stage host; design names the new work: align() runs in bottom-stage hosts with axis 50%, shrink then data-wrap with bottom-stage wrap CSS.'
- id: s-r4
  state: fixed
  body: Design defines fit = floor(stageWidth/charWidth) clamped [5,80], measured after first layout and on resize, no cap at width 0, applied to effective settings in readSettings (stored value kept),
    panel max refreshed on open.
- id: s-r5
  state: fixed
  body: R12 and Speech section now state bottom-stage hosts follow estimated boundaries (tested), and the no-boundary hold is new behaviour reachable only on the plain demo.
- id: s-r6
  state: fixed
  body: Glide is min(100ms, baseMs(wpm)/3), independent of durationMs; mid-glide retarget from current position; snap for > one row and under prefers-reduced-motion.
- id: s-r7
  state: fixed
  body: Inline stops/dwells do not bound the ribbon; prompt renders in stage-details (or status line); speech splits the utterance at the stop and resumes; chip token defined (atom with full field), spoken
    as code/formula.
- id: s-r8
  state: fixed
  body: R3 and design both use letters/digits index floor((n-1)/2); atom time = base x max(1, ceil(len/8)) replacing the flat bonus for atoms.
- id: s-r9
  state: fixed
  body: Test Plan adds steps 3 (chapter card + code stop) and 4 (speech); step 5 marked as also covered pre-merge.
- id: s-r10
  state: fixed
  body: Set via fr acceptance set-status --verify live (commit f0d26fd).
