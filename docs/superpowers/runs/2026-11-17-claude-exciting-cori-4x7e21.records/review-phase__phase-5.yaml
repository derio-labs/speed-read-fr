- id: p5a-r11
  state: refuted
  body: 'The row carries a reword amendment written before the review (docs/acceptance/features/2026-11-17-structure-aware-speed-reader.yaml,
    `row: browser-overlay-and-dock`, op reword, base 0) that restates it as the dock only; the floating
    overlay has its own row. The reviewer read the base text, which an amendment never edits in place.'
- id: p5a-r12
  state: out-of-scope
  body: The spec's floating layout lets pointer events through to nothing, so the faded page cannot be
    selected or pressed and Alt-hover is inactive while the overlay is open; a design choice, now a README
    known limit.
- id: p5a-r13
  state: out-of-scope
  body: The spec's approach restores the inline values saved at opening; pages that restyle those elements
    meanwhile may see them shifted. Now a README known limit.
