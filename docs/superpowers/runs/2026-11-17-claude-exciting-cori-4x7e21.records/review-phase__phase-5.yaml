- kind: review
  id: review-p5
  phase: 5
  title: 'Phase 5 code and visual review by two reviewers: 25 in-scope findings fixed, 1 refuted, 2 out
    of scope'
  body: 'Reviewer a (overlay, dial, layout, dock, permission) checked spec section 13 constant by constant,
    measured behaviour in Chromium on its own pages, compared against the approved mockup at several sizes
    and opened its own screenshots; it also judged p3-r16, p3-r17 and p3-r18 fixed. Reviewer b (text-to-speech,
    README, packaging, CI) checked section 9 against the Web Speech API, the README line by line against
    the code, and drove the voice panel with a fake speechSynthesis. Findings raised: p5a-r1 to p5a-r13
    and p5b-r1 to p5b-r15. Fixes verified by the orchestrator: full gate re-run green (570 unit, 66 browser
    tests, three packages).'
