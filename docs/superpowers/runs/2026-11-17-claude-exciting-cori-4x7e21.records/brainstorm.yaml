- kind: discovery
  input: true
  id: operator-brief
  title: 'Operator brief: /fr-goal implement docs/brief.md'
  body: "Goal as typed: `/fr-goal implement docs/brief.md`\n\n# speed-read-fr: product brief\n\nInput\
    \ for `/fr-goal`. Decisions already taken with the operator are marked **decided**;\neverything else\
    \ is open for the brainstorm round.\n\n## Problem\n\nAI output is long, structured Markdown. Reading\
    \ it line by line is slow. Plain RSVP speed\nreaders are worse: they flash code, formulas and tables\
    \ word by word, mangle lists, drop\nimages, and lose all sense of where you are in the document. Nothing\
    \ found on the market\n(mdr, the Obsidian RSVP plugins, RocketRead, SplashReader, SPDRD, Flow) combines\n\
    structure awareness with an offline browser extension.\n\n## Deliverables and order (decided)\n\n\
    1. Shared reader core (structure extraction, pacing engine, UI), host-agnostic.\n2. Chrome extension\
    \ and Firefox extension (one MV3 codebase, two manifests).\n3. VS Code extension.\n\nAll of it works\
    \ fully offline: no network calls, all libraries bundled.\nherdr plugin: dropped.\n\nAlso required\
    \ (decided): installation instructions for every target in the README, and\nautomated tests written\
    \ test-first.\n\n## Reader UX (shared by every host)\n\n**Layout, three zones**\n- Outline rail: document\
    \ headings, current one highlighted, per-section progress and\n  estimated time; click to jump.\n\
    - Stage: the RSVP chunk with optimal-recognition-point highlight; below it, the current\n  sentence\
    \ faded so you keep your place.\n- Exhibit pane (right, or below when narrow): non-prose blocks of\
    \ the current section,\n  rendered properly. **Decided: reveal on arrival**; blocks already passed\
    \ stay visible.\n\n**Block behaviour**\n- Prose: streamed in chunks; extra dwell on commas, sentence\
    \ ends, long words.\n- Lists: each item is its own unit with an `item 3/7` counter and a short pause\
    \ between\n  items; nested items indented. Lists of short items are shown whole for a dwell rather\n\
    \  than streamed.\n- Code, tables, math: never streamed. Playback stops with e.g. \"Code, 24 lines:\
    \ Space to\n  continue, E to expand\". Per type configurable: stop | skip | dwell N seconds.\n- Images\
    \ and diagrams: shown in the exhibit pane with a dwell; Mermaid rendered.\n- Headings: hard stop.\
    \ Chapter card with title, length and contents summary; Space\n  continues. Which levels stop is configurable\
    \ (default H1, H2). Speed ramps up gently\n  after every stop.\n\n**Settings (decided)**\n- Speed\
    \ (WPM).\n- Number of words shown simultaneously (chunk size), **default: chunks, not single words**.\n\
    - Maximum total characters per chunk; a chunk ends at whichever limit is hit first.\n- Heading levels\
    \ that stop; per-type behaviour for code, tables, math.\n- Bonus: text-to-speech via the browser's\
    \ Web Speech API, chunk display synced to speech\n  boundaries. Offline only with locally installed\
    \ voices (OS voices; Chrome's \"Google\"\n  voices need network): the UI should say so.\n\n**Keys**:\
    \ Space play/pause, ←/→ sentence back/forward, ↑/↓ speed, N/P next/previous\nsection, Tab toggles\
    \ normal reading at the current position, Esc closes.\n\n## Chrome and Firefox\n\n- Entry points:\
    \ toolbar button (selection, else main content), context menu\n  (\"Speed read selection\", \"Speed\
    \ read from here\"), keyboard shortcut (Alt+Shift+R).\n- Hover mode: hold Alt, the block under the\
    \ pointer is outlined; click reads from that\n  block to the end of its container. No modifier-free\
    \ hover trigger.\n- AI chat adapters: on claude.ai, ChatGPT and Gemini, \"container\" is one assistant\
    \ reply.\n  Other sites: generic main-content heuristic.\n- Exhibits are clones of the page's rendered\
    \ DOM, so already-rendered math and diagrams\n  come through as-is.\n- Display: full-page overlay\
    \ (page dimmed) by default; optional docked side panel.\n\n## VS Code\n\n- Entry points: commands\
    \ (file, selection, from cursor); CodeLens \"▶ Read section\" above\n  Markdown headings; hover on\
    \ headings and paragraphs with a \"▶ Speed read from here\" link.\n- Webview panel beside the editor,\
    \ markdown-it + KaTeX + Mermaid bundled.\n- The editor cursor follows the reading position, so stopping\
    \ leaves you at that line.\n- Known limit: extensions cannot read the Copilot or Claude Code chat\
    \ panels; AI output\n  must be in a file or a selection.\n\n## Prior art worth reading\n\n- mdr (github.com/NiloCK/mdr):\
    \ TOC-first terminal RSVP with a code split pane.\n- Obsidian \"Speed Reader\" plugins: block pauses\
    \ for code, LaTeX, tables; following TOC.\n"
