resolves:
- id: sr-r1
  state: fixed
  body: Section 6 now defines exhibit(block, use), document() with locate/refAt, and release(); the host
    owns cloning and the browser returns a slot.
- id: sr-r2
  state: fixed
  body: Host appended to body; wrappers up to body; inherited computed properties and background copied
    onto the outer wrapper; R16 reworded to stylesheet rules applying, with limits listed.
- id: sr-r3
  state: fixed
  body: Canvas replaced by an image of its pixels with a placeholder fallback; shadow-root elements and
    iframe/video/audio/object/embed become placeholders; extraction skips embedded media.
- id: sr-r4
  state: fixed
  body: Token type now carries text; math text comes from the TeX annotation, aria-label or MathML, never
    raw textContent; shown monospace; TTS omits math atoms.
- id: sr-r5
  state: fixed
  body: Exact CSP written with webview.cspSource, style 'unsafe-inline', font and img sources, localResourceRoots;
    core styles use adoptedStyleSheets.
- id: sr-r6
  state: fixed
  body: Rendering happens in an attached hidden container with mermaid.render per fence, awaited before
    extraction; strict security level.
- id: sr-r7
  state: fixed
  body: R21 weakened to block granularity; the markdown-it rule that writes data-line and the tokens that
    get it are named.
- id: sr-r8
  state: fixed
  body: Background keeps no per-tab state; it injects every time and reader.js guards itself.
- id: sr-r9
  state: fixed
  body: gecko id, strict_min_version 128.0, permission check and request on user gesture, API shim, README
    note.
- id: sr-r10
  state: fixed
  body: Capture-phase suppression of mouse events only while Alt is held and a block is outlined; Alt
    keyup default prevented; Linux window-manager limit listed.
- id: sr-r11
  state: fixed
  body: Shortcuts act only with focus on the reader root or stage; inside the settings panel and form
    controls keys belong to the controls.
- id: sr-r12
  state: fixed
  body: Section 11 states the Playwright constraints and what the suite proves; browser-entry-points narrowed;
    new live row chrome-entry-points-in-browser and a Chrome Test Plan step.
- id: sr-r13
  state: fixed
  body: Section 12 specifies full esbuild bundling, vsce package --no-dependencies, .vscodeignore, package.json
    fields and per-package LICENSE.
- id: sr-r14
  state: fixed
  body: Voices read on voiceschanged with a timeout; network voice only by explicit choice; boundary-less
    fallback shows the whole sentence until end.
- id: sr-r15
  state: fixed
  body: Added rows browser-generic-main-content, install-docs and ci-builds-packages; browser-entry-points
    no longer claims container behaviour; Verification says why R1, R24, R26 have none.
- id: sr-r16
  state: fixed
  body: html false, linkify false, Mermaid strict, UI writes text with textContent only.
- id: sr2-r1
  state: fixed
  body: Storage bullet now says storage.local through the shim.
- id: sr2-r2
  state: fixed
  body: permissions.request is the handler's first statement with nothing awaited; behaviour when host
    access is withheld is stated for both browsers.
- id: sr2-r3
  state: fixed
  body: Step now checks persistence across an add-on and tab reload.
- id: sr2-r4
  state: fixed
  body: R12 and section 9 state it.
- id: sr2-r5
  state: fixed
  body: R12 and section 4 give 3 s for images and diagrams (shared) and 5 s for dwell-mode code, tables
    and math.
- id: sr2-r6
  state: fixed
  body: Section 4 lists exactly which events restart the ramp and which steps do not.
- id: sr2-r7
  state: fixed
  body: Content script messages the background, which injects into sender.tab.id.
- id: sr2-r8
  state: fixed
  body: Row amended to cite R13 only.
- id: sr2-r9
  state: fixed
  body: New rows now use spec:<slug>#R<n>.
- id: sr2-r10
  state: fixed
  body: Row reworded to block granularity.
- id: sr2-r11
  state: fixed
  body: Verification states how those two rows are checked on the pull request.
- id: sr2-r12
  state: fixed
  body: Section 8 gives the source range of every command, including readSection.
- id: sr2-r13
  state: fixed
  body: 'Host carries all: initial plus explicit layout properties; hostile-style test page required.'
- id: sr2-r14
  state: fixed
  body: mountReader probes a sentinel after adopting and falls back to a style element.
acceptance:
- id: browser-generic-main-content
  capability: browser-extension
  acceptance: On a page that is not one of the chat sites, or when no reply matches, the reader reads
    the page's main content and leaves out navigation, sidebars and footers.
  origin:
  - spec:2026-11-17-structure-aware-speed-reader#R15
  status: not-implemented
- id: chrome-entry-points-in-browser
  capability: browser-extension
  acceptance: In Chrome the toolbar button, both context-menu items and Alt+Shift+R open the reader on
    the expected content.
  origin:
  - spec:2026-11-17-structure-aware-speed-reader#R13
  status: not-implemented
  verify: live
- id: install-docs
  capability: documentation
  acceptance: The README tells a user how to install and use the reader in Chrome, in Firefox and in VS
    Code, and lists the keys, the settings and the known limits.
  origin:
  - spec:2026-11-17-structure-aware-speed-reader#R23
  status: not-implemented
- id: ci-builds-packages
  capability: distribution
  acceptance: Every pull request and push to main runs the tests and produces a downloadable Chrome package,
    Firefox package and VS Code package.
  origin:
  - spec:2026-11-17-structure-aware-speed-reader#R25
  status: not-implemented
- row: vscode-cursor-follows
  op: reword
  why: 'sr2-r10: R21 is block granularity'
  acceptance: The editor cursor follows the reading position, so pausing or closing the reader leaves
    it on the first source line of the block or list item being read.
