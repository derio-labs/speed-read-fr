journal:
  - {kind: discovery, id: p2-d1, phase: 2, title: "fr isolation exec cannot run npm here: node_modules is darwin", body: "The container is linux-arm64 but the worktree's node_modules was installed on the host (rollup-darwin-arm64), so vitest/playwright were run on the host from the worktree cwd instead of through fr isolation exec."}
  - {kind: discovery, id: p2-d2, phase: 2, title: "The page cannot scroll up, so a block above the band at the page top stays under the cards", body: "The follow aims at bandTop + 8, but a block whose natural top is above that and whose scroller is already at 0 cannot move down. The window (outline) is clipped to the band, so it is empty there. The packaged-build e2e therefore moves to a deeper section (n x3) before asserting the follow."}
  - {kind: finding, id: p2-f1, phase: 2, state: open, review_scope: out, title: "Pages with scroll-snap pull the block back under the cards", body: "On tests/fixtures/snap.html (proximity snap on blocks) the instant scroll to bandTop + 8 snaps back to a snap point, leaving the block under the cards and the outline (clipped to the band) empty. Before this change the aim (10 % of the viewport) was close to a snap point at the top. The p5a-r2 e2e now asserts the window height only for smooth.html. A fix would need the follow to accept the snapped position or lift the snap while following."}
  - {kind: finding, id: p2-f2, phase: 2, state: open, review_scope: out, title: "Title or stop card is squeezed to a strip when the exhibit list is tall", body: "The support is a flex column with a capped height; .sr-stage-details has flex 0 1 auto, so with two or more exhibits the chapter or stop card above them is clipped (visible in the 'title card and two exhibits' screenshot). The same shrink rule existed before the move; now that the card is the first thing under the stage it is more visible."}
  - {kind: discovery, id: p2-d3, phase: 2, title: "VS Code webview e2e indexed exhibits in document order", body: "tests/e2e/webview.spec.ts picked the first and second math exhibit with nth(0) and nth(1); the dock lists the newest first, so the indices swap. The webview shares core's bottomStage dock, so it gets the new order too."}
