schema_version: 12
run: 2026-11-22-feat-three-row-default-ux
step: brainstorm
outcome: done
questions: {rounds: 1}
journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: Operator brief, verbatim
    body: |
      UX improvements: The three-row-flow should be the default. The red brackets in this mode should have a configurable stable length, what a typical human can process in one glance. No red letter in this mode. The WPM display on both read modes should have controls that modify it on the fly in 25 WPM increments. Also, if overlay mode in VS Code cannot work, disable the option.
  - kind: decision
    id: d1-focus-span
    title: Bracket length is a fixed focus span in characters, default 20
    body: Operator answered "20 chars as default." (unit characters, measured in the ribbon font).
  - kind: decision
    id: d2-stepping
    title: One word per step stays
    body: The ribbon still advances one word per step; only the bracket's look changes.
  - kind: decision
    id: d3-migration
    title: Move every existing user to flow once
    body: A one-time migration switches stored chunk to flow; later choices are kept.
  - kind: decision
    id: d4-vscode-display
    title: Hide the Reader display field in VS Code
    body: Leave the field out of the VS Code Settings panel and drop the speedRead.display contribution.
  - kind: decision
    id: d5-wpm-controls
    title: WPM stepper buttons plus wheel on the readout
    body: − / + buttons beside the readout and the mouse wheel over it, 25 WPM per step, both modes.
  - kind: decision
    id: d6-verification
    title: Automated verification, developer gate
    body: Unit tests and Playwright before merge with PR screenshots; nothing held after merge.
resolves: []
acceptance:
  - id: reader-flow-default
    capability: reader-ui
    acceptance: The reader opens in three-row flow mode by default in Chrome, Firefox and VS Code, existing users who had chunk stored are moved to flow once, and a later choice of chunk mode is kept.
    origin: [spec:2026-11-22-flow-default-ux#R1, spec:2026-11-22-flow-default-ux#R2]
    status: not-implemented
    verify: none
  - id: reader-focus-span
    capability: reader-ui
    acceptance: In flow mode the red brackets have one fixed width, a configurable focus span in characters (default 20, 6-40), centred on the target and the same for every word, and no letter of the current word is red.
    origin: [spec:2026-11-22-flow-default-ux#R3, spec:2026-11-22-flow-default-ux#R4, spec:2026-11-22-flow-default-ux#R5]
    status: not-implemented
    verify: none
    visual: ["bracket width at default 20 across several steps (short and long words)", "focus span at 6 and at 40 (clamped to the row)", "no red letter in the current word"]
  - id: reader-wpm-stepper
    capability: reader-ui
    acceptance: In both reading modes the WPM readout has − and + buttons and responds to the mouse wheel, each step changing the speed by 25 WPM within 100-1000 without stopping playback, and the speed is saved.
    origin: [spec:2026-11-22-flow-default-ux#R6]
    status: not-implemented
    verify: none
    visual: ["− and + beside the readout in chunk and in flow mode", "click + and −, wheel up and down over the readout", "limits: at 100 the − step stays 100, at 1000 the + step stays 1000"]
  - id: vscode-no-display-choice
    capability: vscode
    acceptance: The VS Code reader offers no overlay / side-panel display choice, in its Settings panel or its contributed settings, while the browser reader still does.
    origin: [spec:2026-11-22-flow-default-ux#R7]
    status: not-implemented
    verify: none
  - row: reader-snake-flow
    op: reword
    why: The target becomes a fixed focus-span bracket and the red middle letter is dropped (spec 2026-11-22-flow-default-ux R3, R5).
    acceptance: In flow mode the reader shows three rows of one continuous text ribbon in a near-full-width window; words glide one at a time into a fixed-width bracketed target at the middle row's centre, the ribbon wrapping upward bottom to middle to top; the wheel moves it backward or forward word by word, and cards and stops behave as in chunk mode.
