journal:
  - kind: discovery
    id: p1-d1
    phase: 1
    title: StageZone.refresh nulled the live ribbon after a settings rebuild, so resize and settings re-placement no-op'd until the next step
    body: >-
      mount.rebuild() calls player.replaceTimeline (whose step event lays out a new ribbon) and then every zone's refresh();
      the stage's refresh set `ribbon = null`, leaving the DOM ribbon un-tracked. A paused reader then ignored resizes
      (relayoutRibbon no-ops) and the new focusChars handler. refresh now drops the ribbon only when it belongs to an old
      timeline (`ribbon.steps !== ctx.timeline.steps`). Found by the Focus-span clamp-to-row e2e (viewport narrowed after a
      settings change).
  - kind: discovery
    id: p1-d2
    phase: 1
    title: The flow-default migration changes what a mounted reader writes to storage.local on load
    body: >-
      Loading now writes `migrations: ['flow-default']` (and the migrated settings) once. Two existing assertions needed
      adjusting: reader-entry.test.ts "ignores synthetic input" now clears the set spy after the reader is ready, and the
      extension e2e tests clear storage then seed a chunk-mode baseline with the migration already applied (a seeded chunk
      with no `migrations` key is, correctly, migrated to flow). tests/package.test.ts now passes a globalState to the
      packaged extension's activate.
  - kind: discovery
    id: p1-d3
    phase: 1
    title: Acceptance rows not yet moved
    body: >-
      The four rows of docs/acceptance/features/2026-11-22-flow-default-ux.yaml still read not-implemented with no level refs;
      the two amendments (reader-snake-flow, reader-three-row-flow) are already in the fragment. Evidence that backs them:
      core settings/stage/settings-panel unit tests, vscode config/manifest tests, browser storage tests and the new
      tests/e2e/core.spec.ts + extension.spec.ts cases. Left for deliver (`local` rows are stamped there).
