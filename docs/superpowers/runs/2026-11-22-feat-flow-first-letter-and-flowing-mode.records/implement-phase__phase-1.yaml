refactor:
  P1.T5: "stage.ts stays readable with the slide helpers (flowWord, flowGap, syncMotion) next to the ribbon code; the step classification is three lines in flowWord, so a pure classifyFlowStep in ribbon-geometry.ts would only move them away from the state they read."
  P1.T6: "speech reuses flowWord and the same slide path with a spoken flag; there was no duplicated speech check to remove."
  P1.T7: "the e2e helpers openFlow and openInline now pin flowMotion 'word' once for every flow case that reads the middle letter on the centre; nothing further to reuse."
journal:
  - {kind: decision, id: anchor-edges, phase: 1, title: "Anchors gain 'end' and 'begin' so an item gap is a real slide", body: "The spec defines 'after' of a word and 'before' of the next as the same handover point, so a gap slide from {prev, after} to {next, before} would be zero distance and the ribbon would hold for the gap. The Anchor type has two more points, 'end' (the word's right edge) and 'begin' (the next word's left edge): a word before an item gap slides to 'end', the gap crosses to 'begin', the next word slides on from there. Positions still rise on every frame."}
  - {kind: decision, id: atom-first-letter, phase: 1, title: "An atom's first letter is wrapped inside its monospace span", body: "tokenNodes wraps the first letter or digit of the joined word text in span.sr-w-first, also inside span.sr-atom for a code or math word. The existing stage test that expected an atom with no children now expects the single sr-w-first child."}
  - {kind: decision, id: flowing-state, phase: 1, title: "Flowing state is slide + rest anchor, applied through applyX", body: "stage.ts holds slide {from,to,startedAt,durationMs}, rest (the placed word's middle or a frozen point), and a frame handle. placeRibbon cancels the slide and sets rest, the state listener freezes a slide on leaving playing (collapsing nested frozen anchors through freezeAnchor), relayoutRibbon re-derives x from the anchors, and a motion switch starts or cancels a slide at once."}
  - {kind: discovery, id: handle-apply-no-save, phase: 1, title: "handle.applySettings never saves; only the panel path does", body: "mountReader's handle.applySettings calls applySettings(next, false), so a test of 'saved' must change the setting through the Settings panel. The live-setting path (wpm, flowMotion) saves through the player 'settings' listener."}
  - {kind: discovery, id: worktree-no-modules, phase: 1, title: "The fresh worktree has no node_modules", body: "npx vitest failed with ERR_MODULE_NOT_FOUND until npm ci ran in the worktree; node_modules is git-ignored."}
  - {kind: discovery, id: range-stub-single-node, phase: 1, title: "stage.test's Range stub assumed one text node per word", body: "The first-letter span splits a word into several text nodes, so the stubbed Range.getBoundingClientRect now sums the text before the start container."}
resolves: []
