  body: 'flowMotion is now render-only: sameExceptLive in mount.ts, player.setFlowMotion emitting settings, stage settings listener handles the switch; R3 says the position does not move.'
- id: s2
  state: fixed
  body: Design now slides across item gaps in the gap's time, ends a word before an inline stop/dwell on its mid and holds with no back-glide; R4/R5 updated; tests added.
- id: s3
  state: fixed
  body: Continuation/resume/jump rules defined by index relative to r.index; a jump places the word at once then flows; tests for speech on and off.
- id: s4
  state: fixed
  body: First word via show() handled by the same rule; slide time is spokenWordMs(wpm), the tts estimator's own pace, exported from tts.ts.
- id: s5
  state: fixed
  body: Slides are expressed as word anchors and pixels re-derived from current spans every frame, so rebuilds and relayouts need no re-anchoring and cannot jump back; RUN_EDGE test added.
- id: s6
  state: fixed
  body: Test surface names each affected test and whether it is rewritten or pinned to word (flowOpts, core.spec, extension.spec, webview.spec, tts-panel).
