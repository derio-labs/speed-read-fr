  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "flowGap slides from wherever the ribbon rests, sweeping the whole item in the gap's time", body: "With speech and no boundaries the ribbon rests on the item's first word; the timed gap slid it to the next item's begin. Reproduced by a new stage test (x 59 > handover 52.5 before the fix)."}
  - {kind: finding, id: p1-r3, phase: 1, review_scope: in, title: "markBracket/anchorX scan the whole window each frame instead of only the spans near the target", body: "markBracket iterated all spans (up to 400) every frame."}
  - {kind: finding, id: p1-r4, phase: 1, review_scope: in, title: "Acceptance rows reader-flow-first-letter / reader-flowing-motion still not-implemented with no level refs", body: "Tests verifying them landed in this phase."}
