resolves:
  - {id: p1-r1, state: fixed, body: "hereAnchor now re-expresses the live position with pointAnchor, a depth-1 anchor between the two adjacent word middles (binary search); freezeAnchor removed. Pure test asserts flatness over 50 re-freezes; stage test runs a chain of early boundaries."}
  - {id: p1-r2, state: fixed, body: "flowGap slides only when the braces are shown and the ribbon's word is the one before the gap; otherwise the ribbon stays until the next word places it. New stage test red before, green after."}
