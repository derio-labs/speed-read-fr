step: review-phase
item: phase/1
outcome: done
journal:
- kind: finding
  id: p1-r1
  phase: 1
  review_scope: in
  title: Frozen anchors nest one level per early or simultaneous speech boundary, so per-frame anchorX cost grows without bound
  body: freezeAnchor collapsed only when the new slide shared the old `to`; every speech retarget has a new `to`. Verified at ribbon-geometry.ts freezeAnchor and stage.ts hereAnchor.
- kind: finding
  id: p1-r2
  phase: 1
  review_scope: in
  title: flowGap slides from wherever the ribbon rests, sweeping the whole item in the gap's time
  body: With speech and no boundaries the ribbon rests on the item's first word; the timed gap slid it to the next item's begin. Reproduced by a new stage test (x 59 > handover 52.5 before the fix).
- kind: finding
  id: p1-r3
  phase: 1
  review_scope: in
  title: markBracket/anchorX scan the whole window each frame instead of only the spans near the target
  body: markBracket iterated all spans (up to 400) every frame.
- kind: finding
  id: p1-r4
  phase: 1
  review_scope: in
  title: Acceptance rows reader-flow-first-letter / reader-flowing-motion still not-implemented with no level refs
  body: Tests verifying them landed in this phase.
- kind: review
  id: review-p1
  phase: 1
  title: 'phase 1 code review: 4 findings, all in scope, all fixed'
  body: 'Dispatched code reviewer (superpowers:requesting-code-review) raised p1-r1..p1-r4; each verified against the code and fixed with tests (superpowers:receiving-code-review). Reviewer judged the anchor-edges deviation sound. Suite after fixes: vitest
    809 passed / 7 skipped, Playwright 120 passed. Visual pass: the reviewer drove the bottom-stage demo with its own Playwright scripts (review-shots/*.mjs), opened 31 fresh screenshots covering every declared state of both rows, and found no defect.'
resolves:
- id: p1-r1
  state: fixed
  body: hereAnchor now re-expresses the live position with pointAnchor, a depth-1 anchor between the two adjacent word middles (binary search); freezeAnchor removed. Pure test asserts flatness over 50 re-freezes; stage test runs a chain of early boundaries.
- id: p1-r2
  state: fixed
  body: flowGap slides only when the braces are shown and the ribbon's word is the one before the gap; otherwise the ribbon stays until the next word places it. New stage test red before, green after.
- id: p1-r3
  state: fixed
  body: markBracket uses `overlapping` (binary search on sorted spans) to visit only spans near the bracket, tested against a full scan. With anchors flat, anchorX does at most four indexOf lookups per frame, which is negligible.
- id: p1-r4
  state: fixed
  body: Both rows moved to ci with unit and ui level refs via fr acceptance set-status (CI runs npm test and test:e2e).
