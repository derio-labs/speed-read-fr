# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: stable-reader-dock
repo: derio-labs/speed-read-fr
rows:
  - id: browser-fixed-chunk-box
    capability: browser-extension
    acceptance: Overlay and Side panel keep the speed-read box, type size and guides
      fixed through prose, inline code, chapters and exhibits.
    origin: []
    levels:
      ui:
      - speed-read-fr:tests/e2e/extension.spec.ts
    status: ci
    notes: Chromium tests cover both display modes with a local repository-preview fixture.
  - id: vscode-fixed-chunk-box
    capability: vscode-extension
    acceptance: 'The VS Code side panel uses the browser dock''s reader: fixed speed-read
      box, no faded sentence line, chapters and exhibits above the stage.'
    origin: []
    levels: {}
    status: walk-owed
    notes: 'Quick port via bottomStage: true in the webview; UX still WIP, no VS Code
      UI test yet — walk it in the Extension Host.'
amendments:
  - row: browser-floating-overlay
    op: reword
    base: 0
    acceptance: In Overlay, the speed-read box stays at the bottom with steady typography
      and guides, with chapters and exhibits above it. The faded page scrolls to show
      the outlined current block near the visible top of the scroll area.
    why: GitLab feedback replaces the moving browser stage with a fixed bottom reading
      box.
  - row: browser-floating-overlay
    op: drop-level
    base: 1
    level: unit
    ref: speed-read-fr:packages/core/src/ui/layout.test.ts
    why: The legacy stage-push unit suite covers non-browser layouts; the browser fixture
      now verifies fixed stage geometry.
