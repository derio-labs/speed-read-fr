# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-26-word-default-red-toggle-top-dock
repo: derio-labs/speed-read-fr
rows:
  - id: reader-word-motion-default
    capability: reader-ui
    acceptance: Flow motion defaults to Word by word for new users and in VS Code, and
      saved browser settings on Flowing move to Word by word once; a later Flowing choice
      persists.
    origin:
    - spec:2026-11-26-word-default-red-toggle-top-dock#R1
    - spec:2026-11-26-word-default-red-toggle-top-dock#R2
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: reader-red-letters-toggle
    capability: reader-ui
    acceptance: A persisted Red letters setting, on by default, shows or hides the red
      reading letters (flow's in-bracket first letters and chunk's pivot) at once without
      moving the reading position; brackets and guides stay red.
    origin:
    - spec:2026-11-26-word-default-red-toggle-top-dock#R3
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
    visual:
      states:
      - flow with Red letters on and off
      - chunk pivot with Red letters on and off
      - Settings showing the Red letters checkbox in both reading modes
      interactions:
      - toggle Red letters while playing and see the colour change at once
      - reopen the reader and confirm the choice persisted
  - id: browser-dock-stage-top
    capability: browser-extension
    acceptance: In browser Overlay and Side panel the reading box sits fixed at the
      top, with the title or stop card and exhibits below it newest first, earlier ones
      pushed down; in Overlay the faded page follows the current block below the cards.
    origin:
    - spec:2026-11-26-word-default-red-toggle-top-dock#R4
    - spec:2026-11-26-word-default-red-toggle-top-dock#R5
    - spec:2026-11-26-word-default-red-toggle-top-dock#R6
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
    visual:
      states:
      - Overlay with stage on top and no cards
      - Overlay with a title card and two exhibits (newest first)
      - Side panel with stage on top and exhibits below
      - narrow window
      interactions:
      - read past a heading and two exhibits and watch each push the earlier down
      - page follow keeps the current block below the cards
amendments:
  - row: reader-flowing-motion
    op: reword
    base: 0
    acceptance: Flow mode offers a persisted Flow motion choice, Word by word (the default)
      or Flowing; in Flowing the ribbon moves continuously at the set speed without
      holding on each word, freezes on pause and resumes from there, scrubs word by
      word, keeps flowing with speech on, and falls back to word steps under reduced
      motion.
    why: Word by word becomes the default Flow motion (spec 2026-11-26-word-default-red-toggle-top-dock
      R1).
  - row: browser-floating-overlay
    op: reword
    base: 2
    acceptance: In Overlay, the speed-read box stays at the top with steady typography
      and guides, with chapters and exhibits below it, newest first. The faded page
      scrolls to show the outlined current block in the visible area below the reader's
      cards.
    why: The reading box moves to the top (spec 2026-11-26-word-default-red-toggle-top-dock
      R4-R6).
  - row: vscode-fixed-chunk-box
    op: reword
    base: 0
    acceptance: 'The VS Code side panel uses the browser dock''s reader: fixed speed-read
      box at the top, no faded sentence line, chapters and exhibits below the stage,
      newest first.'
    why: The reading box moves to the top in every dock host (spec 2026-11-26-word-default-red-toggle-top-dock
      R4, R5).
