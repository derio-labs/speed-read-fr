name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run package
      - run: npx vitest run tests/package.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/speed-read-chrome.zip
            dist/speed-read-firefox.zip
            dist/speed-read-vscode.vsix
          if-no-files-found: error
